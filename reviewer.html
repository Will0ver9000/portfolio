<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senior Code Reviewer AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-p-6 flex flex-col min-h-screen">

    <!-- API Key Banner -->
    <div class="bg-slate-900 border-b border-slate-800 p-4">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <span class="text-sm text-slate-300">Enter your Gemini API key to enable live code analysis:</span>
            <div class="flex gap-2 w-full md:w-auto">
                <input type="password" id="api-key-input" placeholder="AIzaSy..." class="bg-slate-950 border border-slate-700 text-sm rounded-lg px-3 py-1.5 text-slate-200 focus:outline-none focus:border-cyan-500 w-full md:w-64">
                <button id="save-key-btn" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm px-4 py-1.5 rounded-lg transition whitespace-nowrap">Save Key</button>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-6 py-12 flex-grow w-full">
        <div class="mb-8">
            <a href="index.html" class="text-xs font-semibold text-cyan-400 hover:underline">&larr; Back to Portfolio</a>
            <h1 class="text-3xl font-extrabold tracking-tight mt-2 text-white">Senior Code Reviewer AI</h1>
            <p class="text-slate-400 text-sm mt-1">Paste your code below to receive an elite automated code review covering security, efficiency, and best practices.</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <!-- Code Input Panel -->
            <div class="flex flex-col">
                <label for="code-input" class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Source Code Input</label>
                <textarea id="code-input" rows="12" placeholder="// Paste your JavaScript, HTML, or CSS snippet here..." class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm font-mono text-slate-200 focus:outline-none focus:border-cyan-500 resize-none"></textarea>
                <button id="send-btn" class="mt-4 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    Review Code
                </button>
            </div>

            <!-- AI Output Panel -->
            <div class="flex flex-col">
                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Reviewer Feedback</label>
                <div id="output-box" class="bg-slate-900 border border-slate-800 rounded-xl p-4 text-sm text-slate-300 h-[312px] overflow-y-auto font-sans leading-relaxed whitespace-pre-wrap">Awaiting your code snippet...</div>
            </div>
        </div>
    </main>

    <script>
        const MODEL = "gemini-1.5-flash";
        
        // Load saved key on startup
        const apiKeyInput = document.getElementById('api-key-input');
        const savedKey = localStorage.getItem('gemini_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
        }

        document.getElementById('save-key-btn').addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key saved securely to browser localStorage!');
            } else {
                alert('Please enter a valid key.');
            }
        });

        document.getElementById('send-btn').addEventListener('click', async () => {
            const apiKey = localStorage.getItem('gemini_api_key') || apiKeyInput.value.trim();
            const codeInput = document.getElementById('code-input').value.trim();
            const outputBox = document.getElementById('output-box');

            if (!apiKey) {
                alert('Please enter and save your Gemini API key first.');
                return;
            }

            if (!codeInput) {
                alert('Please paste some code to review.');
                return;
            }

            outputBox.textContent = "Analyzing code architecture and security patterns...";

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `You are an elite senior software engineer. Perform a structured code review on the following snippet. Highlight bugs, security vulnerabilities, performance bottlenecks, and provide a refactored version:\n\n${codeInput}`
                            }]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    outputBox.textContent = `API Error: ${data.error.message}`;
                    return;
                }

                const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
                outputBox.textContent = reply || "Received empty response from model.";
            } catch (err) {
                outputBox.textContent = `Network Error: ${err.message}`;
            }
        });
    </script>
</body>
</html>
